# Install in /etc/nginx/conf.d/endport.conf after obtaining a certificate for
# *.endport.io. Keep the existing Nginx sites and their certificates intact.
map $http_upgrade $endport_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.endport.io *.endport.io;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.endport.io *.endport.io;

    ssl_certificate /etc/nginx/ssl/endport/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/endport/key.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $endport_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 2m;
    }
}
