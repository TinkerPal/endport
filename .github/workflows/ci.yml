name: Endport CI

on:
  push:
  pull_request:

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test --workspace @endport/cli
      - run: npm pack --workspace @endport/cli --dry-run
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test --workspace @endport/cli
      - run: npm run build:vercel
      - run: test -f dist/landing.html && test ! -e dist/index.html
      - name: Create local test configuration
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" > .env.test
          echo "ACME_EMAIL=admin@endport.io" >> .env.test
          echo "INTERNAL_SHARED_SECRET=$(openssl rand -hex 32)" >> .env.test
      - run: docker compose --env-file .env.test -f compose.yaml -f compose.dev.yaml up -d --build db app
      - run: node tests/e2e.mjs
      - if: failure()
        run: docker compose --env-file .env.test -f compose.yaml -f compose.dev.yaml logs --no-color app db
      - if: always()
        run: docker compose --env-file .env.test -f compose.yaml -f compose.dev.yaml down --volumes
